<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="refresh" content="0;url=https://ais-dev-zy34t2fxpgsj7vkrwmj3um-835387676505.asia-southeast1.run.app" />
    <title>Open MediGuide AI in Chrome</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh;
        background: #0f172a;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
      }
      .card {
        background: #1e293b;
        border: 2px solid #0d9488;
        border-radius: 20px;
        padding: 40px 24px;
        max-width: 360px;
        width: 90%;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      }
      h1 {
        font-size: 22px;
        margin-bottom: 12px;
        color: #2dd4bf;
      }
      p {
        font-size: 14px;
        color: #94a3b8;
        line-height: 1.5;
        margin-bottom: 20px;
      }
    </style>
    <script>
      function openInChrome() {
        const targetUrl = 'https://ais-dev-zy34t2fxpgsj7vkrwmj3um-835387676505.asia-southeast1.run.app';
        if (/android/i.test(navigator.userAgent)) {
          window.location.replace('intent://' + targetUrl.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end;');
        } else {
          window.location.replace(targetUrl);
        }
      }
      window.onload = openInChrome;
    </script>
  </head>
  <body onclick="openInChrome()" ontouchstart="openInChrome()">
    <div class="card">
      <h1>MediGuide AI</h1>
      <p>Opening MediGuide AI in Google Chrome...</p>
      <p style="font-size:12px; color:#64748b;">Tap anywhere if redirection doesn't start automatically.</p>
    </div>
  </body>
</html>
